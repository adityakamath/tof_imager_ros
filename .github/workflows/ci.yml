name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, kilted, lyrical]
    container:
      image: ros:${{ matrix.distro }}-ros-base
      # The runner's default resolver failed to look up the Ubuntu mirrors on every job
      options: --dns 8.8.8.8 --dns 1.1.1.1
    defaults:
      run:
        # The ROS setup scripts are bash; container steps default to sh
        shell: bash
    env:
      # Newer pip refuses system-wide installs; older pip ignores this variable
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - name: Install tools
        run: |
          cat /etc/resolv.conf
          getent hosts archive.ubuntu.com || echo "archive.ubuntu.com does not resolve"
          # Retry transient apt failures; Error-Mode=any makes a failed fetch fail the update
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          missing=""
          command -v git >/dev/null || missing="$missing git"
          command -v pip3 >/dev/null || missing="$missing python3-pip"
          command -v gcc >/dev/null || missing="$missing build-essential"
          command -v colcon >/dev/null || missing="$missing ros-dev-tools"
          [ -f /usr/include/python3*/Python.h ] || [ -f /usr/include/python3.*/Python.h ] || missing="$missing python3-dev"
          if [ -n "$missing" ]; then
            for attempt in 1 2 3; do apt-get update -o APT::Update::Error-Mode=any && break; sleep 20; done
            apt-get install -y --no-install-recommends $missing
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths . --ignore-src -y -r --rosdistro ${{ matrix.distro }}
          pip3 install ./vl53l5cx_python

      - name: Build
        run: |
          . /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_direct+

      # The sensor itself needs hardware, so check what a runner can: the node imports against this distro's
      # rclpy and the launch file builds its description.
      - name: Smoke test
        run: |
          . /opt/ros/${{ matrix.distro }}/setup.bash
          . install/setup.bash
          python3 -c "import tof_imager_ros.tof_imager_publisher"
          python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('tof_imager_launch', 'launch/tof_imager.launch.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.generate_launch_description()"
